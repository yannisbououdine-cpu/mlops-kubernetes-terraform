# Les règles vivent dans alerts/rules.yaml, hors du moteur de gabarits de Helm :
# leurs annotations utilisent les doubles accolades de Prometheus, que Helm interpréterait.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "digit-classifier.labels" . | nindent 4 }}
spec:
  {{- .Files.Get "alerts/rules.yaml" | nindent 2 }}
