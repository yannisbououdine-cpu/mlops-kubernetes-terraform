name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Droits minimaux par défaut ; chaque job n'ajoute que ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.2

jobs:
  app:
    name: API - lint et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r app/requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (dont le seuil de qualité du modèle)
        working-directory: app
        run: python -m pytest

  infra:
    name: Infrastructure - validation et scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint du Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < app/Dockerfile

      - name: Lint des workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Lint du chart Helm
        run: helm lint chart --strict --set image=digit-classifier:ci

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Scan de sécurité de l'IaC (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"

  e2e:
    name: Déploiement de bout en bout sur kind
    needs: [app, infra]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publication de l'image sur GHCR, uniquement depuis main
    env:
      IMAGE: digit-classifier:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Entraîner le modèle et construire l'image
        run: >-
          docker build app
          --tag "$IMAGE"
          --build-arg MODEL_VERSION="${GITHUB_SHA::7}"
          --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Scanner les vulnérabilités de l'image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        id: init
        run: terraform -chdir=terraform init -input=false

      - name: terraform plan
        run: terraform -chdir=terraform plan -input=false -var "image=$IMAGE" -out=tfplan

      - name: terraform apply
        run: terraform -chdir=terraform apply -input=false tfplan

      - name: Test de fumée
        run: scripts/smoke-test.sh

      - name: Diagnostic du cluster
        if: failure() && steps.init.outcome == 'success'
        run: |
          export KUBECONFIG=terraform/kubeconfig
          kubectl get pods -A -o wide || true
          kubectl describe pods -n ml || true
          kubectl logs -n ml -l app.kubernetes.io/name=digit-classifier --tail=100 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true

      - name: Publier l'image sur GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/digit-classifier:${GITHUB_SHA::7}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE" "$target"
          docker push "$target"
          echo "Image publiée : \`$target\`" >> "$GITHUB_STEP_SUMMARY"

      - name: terraform destroy
        if: always() && steps.init.outcome == 'success'
        run: terraform -chdir=terraform destroy -input=false -auto-approve -var "image=$IMAGE"
